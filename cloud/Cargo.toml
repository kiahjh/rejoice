[package]
name = "cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
maud = "0.27.0"
rejoice = { path = "../rejoice", features = ["sqlite"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
serde_urlencoded = "0.7.1"
urlencoding = "2.1.3"
uuid = { version = "1.17.0", features = ["v4"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
base64 = "0.22.1"
jsonwebtoken = "9.3.1"
hmac = "0.12.1"
sha2 = "0.10.8"
chrono = "0.4.40"
hex = "0.4.3"

[build-dependencies]
rejoice = { path = "../rejoice" }
