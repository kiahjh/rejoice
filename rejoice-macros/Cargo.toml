[package]
name = "rejoice-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc macros for the Rejoice web framework"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.104", features = ["full", "extra-traits"] }

[dev-dependencies]
maud = "0.27.0"
rejoice = { path = "../rejoice" }
trybuild = "1.0.105"
